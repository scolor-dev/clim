<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>clim settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <header class="header">
        <div>
          <h1>clim settings</h1>
          <p>ドメインごとのタイトルトリミングルールを編集できます。</p>
        </div>
        <div class="actions">
          <button id="addRule" type="button">追加</button>
          <button id="resetRules" type="button" class="secondary">初期化</button>
        </div>
      </header>

      <form id="rulesForm">
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>有効</th>
                <th>ドメイン</th>
                <th>種類</th>
                <th>パターン</th>
                <th>flags</th>
                <th>説明</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rulesBody"></tbody>
          </table>
        </div>

        <footer class="footer">
          <button type="submit">保存</button>
          <p id="message" role="status"></p>
        </footer>
      </form>
    </main>

    <template id="ruleRowTemplate">
      <tr>
        <td>
          <input class="enabled" type="checkbox" aria-label="有効">
        </td>
        <td>
          <input class="domain" type="text" placeholder="zenn.dev, qiita.com, *">
        </td>
        <td>
          <select class="type">
            <option value="regex">正規表現</option>
            <option value="text">文字列</option>
          </select>
        </td>
        <td>
          <input class="pattern" type="text" placeholder="削除したい文字列または正規表現">
        </td>
        <td>
          <input class="flags" type="text" placeholder="gi">
        </td>
        <td>
          <input class="description" type="text" placeholder="メモ">
        </td>
        <td>
          <button class="deleteRule iconButton" type="button" aria-label="削除">×</button>
        </td>
      </tr>
    </template>

    <script type="module" src="options.js"></script>
  </body>
</html>

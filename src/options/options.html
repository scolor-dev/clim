<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>clim settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <header class="header">
        <div>
          <h1>clim 設定</h1>
          <p>出力テンプレートとサイト別のタイトル取得・削除ルールを編集できます。</p>
        </div>
        <div class="actions">
          <button id="saveSettings" type="button">保存</button>
          <button id="resetSettings" type="button" class="secondary">初期化</button>
        </div>
      </header>

      <nav class="tabs" aria-label="設定カテゴリ">
        <button class="tab active" type="button" data-panel="templatesPanel">出力テンプレート</button>
        <button class="tab" type="button" data-panel="sitesPanel">サイト別設定</button>
      </nav>

      <section id="templatesPanel" class="panel active">
        <div class="sectionHeader">
          <div>
            <h2>出力テンプレート</h2>
            <p><code>{title}</code> や <code>{url}</code> などの変数を使ってコピー形式を変更できます。</p>
          </div>
          <button id="addTemplate" type="button" class="secondary">テンプレート追加</button>
        </div>
        <div id="templatesList" class="stack"></div>
      </section>

      <section id="sitesPanel" class="panel">
        <div class="sectionHeader">
          <div>
            <h2>サイト別設定</h2>
            <p><code>*</code> は全サイト共通のルート設定です。削除できず、ドメインは固定です。</p>
          </div>
          <button id="addSite" type="button" class="secondary">サイト追加</button>
        </div>
        <div id="sitesList" class="stack"></div>
      </section>

      <p id="message" role="status"></p>
    </main>

    <template id="templateItemTemplate">
      <article class="item outputTemplateItem">
        <div class="itemHeader">
          <label>
            <span>名前</span>
            <input class="templateLabel" type="text">
          </label>
          <label>
            <span>ID</span>
            <input class="templateId" type="text">
          </label>
          <button class="deleteTemplate iconButton" type="button" aria-label="削除">×</button>
        </div>
        <label>
          <span>テンプレート</span>
          <textarea class="templateText" rows="5" spellcheck="false"></textarea>
        </label>
      </article>
    </template>

    <template id="siteItemTemplate">
      <article class="item siteItem">
        <div class="itemHeader">
          <label class="enabledLabel">
            <input class="siteEnabled" type="checkbox">
            <span>有効</span>
          </label>
          <label>
            <span>ドメイン</span>
            <input class="siteDomain" type="text" placeholder="zenn.dev, qiita.com, *">
          </label>
          <button class="deleteSite iconButton" type="button" aria-label="削除">×</button>
        </div>
        <div class="switches">
          <label><input class="useJsonLdTitle" type="checkbox"> JSON-LDタイトル</label>
          <label><input class="useOpenGraphTitle" type="checkbox"> OGPタイトル</label>
          <label><input class="useDocumentTitle" type="checkbox"> document.title fallback</label>
        </div>
        <label>
          <span>タイトル取得CSSセレクタ</span>
          <textarea class="titleSelectors" rows="4" spellcheck="false" placeholder="article h1&#10;main h1&#10;h1"></textarea>
        </label>
        <label>
          <span>タイトル削除ルール</span>
          <textarea class="trimmingRules" rows="5" spellcheck="false" placeholder="regex|末尾に削る正規表現|i|説明&#10;text|削りたい文字列||説明"></textarea>
        </label>
      </article>
    </template>

    <script src="../shared/shared-config.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>

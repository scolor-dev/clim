<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clim home</title>
    <link rel="stylesheet" href="home.css">
  </head>
  <body>
    <main class="home">
      <section class="hero" aria-labelledby="pageTitle">
        <div class="iconShell">
          <img src="../../icons/icon-128.png" alt="" width="88" height="88">
        </div>
        <p class="eyebrow">clean link maker</p>
        <h1 id="pageTitle">Clim</h1>
        <p class="lead">現在のページURLを、ショートカットや右クリックからそのままコピーできる小さな土台です。</p>
        <nav class="actions" aria-label="Clim pages">
          <button id="openSettings" type="button">設定を開く</button>
          <button id="openShortcuts" type="button" class="secondary">ショートカット</button>
        </nav>
      </section>

      <section class="status" aria-label="current status">
        <article>
          <span class="mark"></span>
          <div>
            <h2>URLコピー</h2>
            <p>内部処理は空に近く、現在のページURLを加工せずそのままコピーします。</p>
          </div>
        </article>
        <article>
          <span class="mark"></span>
          <div>
            <h2>ショートカット</h2>
            <p>Alt + Shift + C、MacではControl + Shift + Cでコピーできます。</p>
          </div>
        </article>
        <article>
          <span class="mark"></span>
          <div>
            <h2>ページ右クリック</h2>
            <p>Webページ上の右クリックメニューからClimでURLをコピーできます。</p>
          </div>
        </article>
      </section>
    </main>
    <script src="home.js"></script>
  </body>
</html>
